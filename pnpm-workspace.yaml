packages:
  - packages/*

# pnpm 11 reads only auth, registry, and TLS settings from .npmrc; every other setting
# belongs here.
engineStrict: true
minimumReleaseAge: 20160
blockExoticSubdeps: true
allowBuilds:
  lefthook: false
